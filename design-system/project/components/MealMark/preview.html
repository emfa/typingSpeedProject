<!doctype html>
<html lang="en">
<head>

<title>MealMark — preview</title>

<body>
<div class="q-stage" id="row"></div>
<script>
(function () {
  var Q = window.Qubool;

    '<span class="q-meal q-meal-veg">' + Q.mealMark('veg') + 'Veg</span>' +
    '<span class="q-meal q-meal-nonveg">' + Q.mealMark('nonveg') + 'Non-veg</span>' +
    '<span class="q-meal q-meal-veg">' + Q.mealMark('veg') + '12 plates</span>' +
    '<span class="q-meal q-meal-nonveg">' + Q.mealMark('nonveg') + '29 plates</span>';
})();
